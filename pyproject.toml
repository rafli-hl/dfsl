[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dfsl"
version = "0.1.0"
description = "Distribution-Free Sequential Learning: robust online regression under heavy-tailed and contaminated data streams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rafli", email = "rafli@pyhron.com" }]
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "loguru>=0.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "kaggle"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
