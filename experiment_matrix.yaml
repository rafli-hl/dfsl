V8_scale_invariance: >
  THE DEFINING PROPERTY OF C-10, AND THE ONE NEVER YET TESTED. The whole reason the inherited
  criteria fail to transfer is that their thresholds carry units: Jane's 50 is a loss level
  calibrated to standardized targets, crypto's 1e3 likewise. A criterion whose thresholds are
  ratios should be exactly invariant when the units of the problem change.
  Test, applied to the CRITERION FUNCTION directly rather than to the learner: take each
  recorded run's (y, preds, wts) and multiply BOTH y and preds by c, for
  c in {1e-3, 1, 1e3}. This is a pure change of units -- it rescales the learner's errors and
  the reference's errors identically -- so a unit-free criterion must return an identical
  classification for all three. Note this is NOT a claim that the ALGORITHM is equivariant to
  rescaling the target; it is not, and no learner is re-run here.
  PASS requires 100% identical classification across c, on every run, on every stream.
